name: CMake

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            qt_arch: gcc_64
          - name: Linux Clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            qt_arch: gcc_64
          - name: Windows MSVC
            os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            qt_arch: win64_msvc2019_64
          - name: macOS Clang
            os: macos-15-intel
            c_compiler: clang
            cpp_compiler: clang++
            qt_arch: clang_64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine
          cache: true

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
